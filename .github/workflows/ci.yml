name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm@12.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Dependency cruiser lint
        run: pnpm lint:deps

      - name: Integration tests
        env:
          KEEP_TEST_ADMIN_URL: mysql://root:root@127.0.0.1:3306/
        run: pnpm test:int

      - name: Build Docker prod image
        run: docker build --target prod .
